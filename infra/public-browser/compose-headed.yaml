# Separate image/runtime variant; same disposable security boundary as the
# headless compartment. Runtime Node integration must use --network none and
# private Docker-exec bridges, with no ports or host mounts.
services:
  public-browser-headed:
    build:
      context: .
      dockerfile: Dockerfile.headed
    image: playwright-demo-public-browser-headed:1.63.0-p4-3a
    init: true
    read_only: true
    user: pwuser
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
      XDG_CONFIG_HOME: /tmp/config
      XDG_RUNTIME_DIR: /tmp/runtime
      PUBLIC_BROWSER_CONTROL_TOKEN: ${PUBLIC_BROWSER_CONTROL_TOKEN:?set a per-run token}
      PUBLIC_BROWSER_PROXY: ${PUBLIC_BROWSER_PROXY:?set the private proxy endpoint}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    networks:
      - browser-control

networks:
  browser-control:
    internal: true
