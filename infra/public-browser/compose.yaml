# This compose file establishes only the browser compartment.  It deliberately
# does not publish a port, mount a host path, or provide a host-network escape.
# The Node G1 integration must attach its per-run private control/proxy bridge
# before this definition can be used for a protected public run.
services:
  public-browser:
    build:
      context: .
      dockerfile: Dockerfile
    image: playwright-demo-public-browser:1.63.0
    init: true
    read_only: true
    user: pwuser
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp/home
      XDG_CACHE_HOME: /tmp/cache
      XDG_CONFIG_HOME: /tmp/config
      XDG_RUNTIME_DIR: /tmp/runtime
      # Values come from trusted per-run launch configuration. Provider
      # credentials and arbitrary inherited host variables are absent.
      PUBLIC_BROWSER_CONTROL_TOKEN: ${PUBLIC_BROWSER_CONTROL_TOKEN:?set a per-run token}
      PUBLIC_BROWSER_PROXY: ${PUBLIC_BROWSER_PROXY:?set the private proxy endpoint}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    expose:
      - "9222"
    networks:
      - browser-control

networks:
  # Internal networks have no default route to Docker's external networks.
  # A future trusted bridge may join this network only to expose the existing
  # authoritative proxy and authenticated private control channel.
  browser-control:
    internal: true
